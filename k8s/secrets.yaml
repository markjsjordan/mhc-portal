# Folk Care Secrets
# IMPORTANT: Replace placeholder values before applying!
# Generate base64 values: echo -n 'your-value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: folkcare-secrets
  namespace: folkcare
  labels:
    app.kubernetes.io/name: folkcare
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Populate from external secret manager (e.g. HashiCorp Vault, AWS Secrets Manager, or SealedSecrets)
  # Do not store hardcoded base64 or plaintext passwords in Git
  JWT_SECRET: ""
  POSTGRES_PASSWORD: ""
  ANTHROPIC_API_KEY: ""
  RESEND_API_KEY: ""
  SENTRY_DSN: ""
