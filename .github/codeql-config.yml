# CodeQL Configuration
# Customizes security scanning to reduce false positives

name: "Folk Care CodeQL Config"

# Paths to exclude from analysis
paths-ignore:
  # Test files - load testing uses Math.random() intentionally for test data
  - tests/load/**
  - packages/web/src/core/providers/showcase-api-provider.ts

# HIPAA-014: Enable all security queries across codebase without blanket suppressions
query-filters: []
