name: Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - preview
          - production
      deployment_id:
        description: 'Previous deployment ID to rollback to (from Vercel dashboard)'
        required: true
        type: string
      reason:
        description: 'Reason for rollback (brief description of the issue)'
        required: true
        type: string

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  rollback:
    name: Rollback ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Validate Rollback Request
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          INPUT_REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "::warning::━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "::warning::EMERGENCY ROLLBACK INITIATED"
          echo "::warning::━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Environment: ${INPUT_ENVIRONMENT}"
          echo "Target Deployment ID: ${INPUT_DEPLOYMENT_ID}"
          echo "Reason: ${INPUT_REASON}"
          echo "Initiated by: ${ACTOR}"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "::warning::━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Execute Rollback
        env:
          INPUT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          echo "🔄 Rolling back to deployment: ${INPUT_DEPLOYMENT_ID}"

          # Promote the previous deployment to current environment
          vercel promote "${INPUT_DEPLOYMENT_ID}" \
            --token "${VERCEL_TOKEN}" \
            --scope "${VERCEL_ORG_ID}" \
            --yes || {
              echo "::error::Rollback failed using 'promote' command"
              echo "::error::Please check the deployment ID and try manual rollback via Vercel dashboard"
              exit 1
            }

          echo "✅ Rollback command executed successfully"

      - name: Verify Rollback
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "⏳ Waiting for rollback to complete..."
          sleep 15

          # Determine the URL based on environment
          if [ "${INPUT_ENVIRONMENT}" == "production" ]; then
            URL="https://folk.care"
          else
            URL="https://preview-folk.care"
          fi

          echo "🔍 Verifying deployment at: $URL"

          # Simple connectivity check
          if curl -f -s -o /dev/null -w "%{http_code}" "$URL" | grep -q "200\|301\|302"; then
            echo "✅ Deployment is responding"
          else
            echo "⚠️ Deployment verification inconclusive - please check manually"
          fi

      - name: Post-Rollback Actions
        if: always()
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          INPUT_REASON: ${{ inputs.reason }}
        run: |
          echo "::notice::━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "::notice::ROLLBACK COMPLETED"
          echo "::notice::━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Environment: ${INPUT_ENVIRONMENT}"
          echo "Rolled back to: ${INPUT_DEPLOYMENT_ID}"
          echo "Reason: ${INPUT_REASON}"
          echo ""
          echo "⚠️  IMPORTANT POST-ROLLBACK STEPS:"
          echo "1. Verify the application is functioning correctly"
          echo "2. Check error logs in Vercel dashboard"
          echo "3. Investigate root cause: ${INPUT_REASON}"
          echo "4. Create a post-mortem if needed"
          echo "5. Plan fix for the issue that caused rollback"
          echo ""
          echo "If database migrations were run, you may need to:"
          echo "• Roll back migrations manually if they're incompatible"
          echo "• Restore database from backup if data corruption occurred"
          echo ""
          echo "::notice::━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Create Rollback Issue
        if: always()
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          INPUT_REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "📝 To track this rollback, consider creating a GitHub issue:"
          echo ""
          echo "Title: [Rollback] ${INPUT_ENVIRONMENT} - $(date -u '+%Y-%m-%d')"
          echo "Labels: rollback, incident, ${INPUT_ENVIRONMENT}"
          echo ""
          echo "Body:"
          echo "## Rollback Summary"
          echo "- **Environment**: ${INPUT_ENVIRONMENT}"
          echo "- **Deployment ID**: ${INPUT_DEPLOYMENT_ID}"
          echo "- **Reason**: ${INPUT_REASON}"
          echo "- **Initiated by**: ${ACTOR}"
          echo "- **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "## Actions Required"
          echo "- [ ] Verify application functionality"
          echo "- [ ] Investigate root cause"
          echo "- [ ] Create fix"
          echo "- [ ] Test fix in preview"
          echo "- [ ] Deploy fix to production"
          echo "- [ ] Document lessons learned"
