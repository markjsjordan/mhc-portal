name: Database Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Database operation'
        required: true
        default: 'migrate'
        type: choice
        options:
          - migrate
          - rollback
          - status
          - seed
          - nuke
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '22'

jobs:
  database-operation:
    name: Database ${{ github.event.inputs.operation }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Guard against destructive operations in production
        if: ${{ github.event.inputs.environment == 'production' && (github.event.inputs.operation == 'nuke' || github.event.inputs.operation == 'seed') }}
        run: |
          echo "❌ HIPAA VIOLATION: Destructive or demo seed operation '${{ github.event.inputs.operation }}' is strictly prohibited on production!"
          exit 1

      - name: Set environment variables
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "NODE_ENV=production" >> $GITHUB_ENV
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" >> $GITHUB_ENV
          else
            echo "NODE_ENV=staging" >> $GITHUB_ENV
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" >> $GITHUB_ENV
          fi

      - name: Run database operation
        run: |
          case "${{ github.event.inputs.operation }}" in
            "migrate")
              npm run db:migrate
              ;;
            "rollback")
              npm run db:migrate:rollback
              ;;
            "status")
              npm run db:migrate:status
              ;;
            "seed")
              if [ "${{ github.event.inputs.environment }}" = "production" ]; then
                echo "❌ HIPAA VIOLATION: Cannot seed demo data in production"
                exit 1
              fi
              npm run db:seed
              ;;
            "nuke")
              if [ "${{ github.event.inputs.environment }}" = "production" ] || [ "$NODE_ENV" = "production" ]; then
                echo "❌ HIPAA VIOLATION: Cannot nuke production database"
                exit 1
              fi
              echo "⚠️  WARNING: This will destroy all data in ${{ github.event.inputs.environment }}"
              npm run db:nuke
              ;;
          esac

      - name: Notify on completion
        if: always()
        run: |
          if [ ${{ job.status }} = 'success' ]; then
            echo "✅ Database ${{ github.event.inputs.operation }} completed successfully on ${{ github.event.inputs.environment }}"
          else
            echo "❌ Database ${{ github.event.inputs.operation }} failed on ${{ github.event.inputs.environment }}"
            exit 1
          fi