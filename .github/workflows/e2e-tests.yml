name: E2E Tests

# Tiered E2E execution:
# - pull_request (preview, develop): fast @smoke tier (chromium only, 15m timeout)
# - push (preview, production): full chromium suite (non-gating for deploy, 30m timeout)
# - schedule (nightly 07:00 UTC): full chromium + mobile-chrome suite
# - workflow_dispatch: manual browser selection or visual baseline updates
on:
  pull_request:
    branches: [preview, develop]
  push:
    branches: [preview, production]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test (all, chromium, firefox, webkit, mobile)'
        required: false
        default: 'chromium'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
          - mobile
      update_visual_baselines:
        description: 'Regenerate Linux visual regression baselines and open a PR'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  NPM_VERSION: '10.9.4'
  DATABASE_NAME: 'folkcare_e2e_test'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  e2e-smoke:
    name: E2E Smoke (chromium)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: folkcare_e2e_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm 10.9.4
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            verticals/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-e2e-

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build packages
        run: npx turbo run build

      - name: Check for unapproved bare test.skip() in e2e/tests
        run: npm run lint:e2e-skips

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup E2E test database
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ env.DATABASE_NAME }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ env.DATABASE_NAME }}
        run: |
          echo "Setting up E2E test database..."
          createdb -h localhost -U postgres ${{ env.DATABASE_NAME }} || echo "Database already exists"
          npm run db:migrate

      - name: Run E2E smoke tests
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ env.DATABASE_NAME }}
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3000
          CI: true
          JWT_SECRET: ${{ secrets.JWT_SECRET_E2E || 'ci-test-jwt-secret-minimum-32-characters-required-for-security-testing' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET_E2E || 'ci-test-jwt-refresh-secret-minimum-32-characters-required-for-testing' }}
        run: |
          echo "Running E2E smoke tests (chromium)..."
          (npm run preview --workspace=@folkcare/web -- --port 5173 --strictPort > /tmp/e2e-web.log 2>&1 &)
          ready=0
          for i in $(seq 1 60); do
            c=$(curl -s -m 2 -o /dev/null -w "%{http_code}" http://localhost:5173/login || true)
            if [ "$c" = "200" ]; then
              echo "WEB_READY_HTTP_200 after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          echo "--- web preview log (first 40 lines) ---"; head -40 /tmp/e2e-web.log || true
          if [ "$ready" != "1" ]; then
            echo "::error::Web preview server did not become ready on :5173"
            exit 1
          fi
          npm run test:smoke

      - name: Verify JUnit test results
        if: always()
        run: |
          test -f e2e-results.xml || { echo "::error::e2e-results.xml not found"; exit 1; }
          grep -E 'tests="[1-9][0-9]*"' e2e-results.xml || { echo "::error::JUnit report has 0 tests"; head -20 e2e-results.xml; exit 1; }

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 30
          if-no-files-found: error

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: junit-results-smoke
          path: e2e-results.xml
          retention-days: 30
          if-no-files-found: error

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-videos-smoke
          path: test-results/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-screenshots-smoke
          path: test-results/**/*.png
          retention-days: 7

  e2e-tests:
    name: E2E Tests (${{ matrix.browser || 'chromium' }})
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.update_visual_baselines != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # 30 min: full suite + web preview + retries (owner-approved)

    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event.inputs.browser == 'all' && fromJSON('["chromium", "firefox", "webkit"]') || (github.event_name == 'workflow_dispatch' && github.event.inputs.browser && github.event.inputs.browser != 'mobile' && fromJSON(format('["{0}"]', github.event.inputs.browser))) || fromJSON('["chromium"]') }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: folkcare_e2e_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm 10.9.4
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            verticals/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-e2e-

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build packages
        run: npx turbo run build

      - name: Check for unapproved bare test.skip() in e2e/tests
        run: npm run lint:e2e-skips

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Setup E2E test database
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ env.DATABASE_NAME }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ env.DATABASE_NAME }}
        run: |
          echo "Setting up E2E test database..."
          createdb -h localhost -U postgres ${{ env.DATABASE_NAME }} || echo "Database already exists"
          npm run db:migrate

      - name: Run E2E tests
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ env.DATABASE_NAME }}
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3000
          CI: true
          JWT_SECRET: ${{ secrets.JWT_SECRET_E2E || 'ci-test-jwt-secret-minimum-32-characters-required-for-security-testing' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET_E2E || 'ci-test-jwt-refresh-secret-minimum-32-characters-required-for-testing' }}
        run: |
          echo "Running E2E tests for ${{ matrix.browser }}..."
          # UI tests need the built web app (React SPA). The API on :3000 has no
          # static serving, so /login never rendered. Serve packages/web/dist on
          # :5173 via vite preview (which proxies /api to :3000), and point the
          # UI tests at it. API-only specs keep working against :3000.
          (npm run preview --workspace=@folkcare/web -- --port 5173 --strictPort > /tmp/e2e-web.log 2>&1 &)
          ready=0
          for i in $(seq 1 60); do
            c=$(curl -s -m 2 -o /dev/null -w "%{http_code}" http://localhost:5173/login || true)
            if [ "$c" = "200" ]; then
              echo "WEB_READY_HTTP_200 after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          echo "--- web preview log (first 40 lines) ---"; head -40 /tmp/e2e-web.log || true
          if [ "$ready" != "1" ]; then
            echo "::error::Web preview server did not become ready on :5173"
            exit 1
          fi
          npm run test:e2e -- --project=${{ matrix.browser }}

      - name: Verify JUnit test results
        if: always()
        run: |
          test -f e2e-results.xml || { echo "::error::e2e-results.xml not found"; exit 1; }
          grep -E 'tests="[1-9][0-9]*"' e2e-results.xml || { echo "::error::JUnit report has 0 tests"; head -20 e2e-results.xml; exit 1; }

      - name: Generate accessibility report
        if: always()
        run: |
          echo "Accessibility violations will be included in test report"

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: error

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: junit-results-${{ matrix.browser }}
          path: e2e-results.xml
          retention-days: 30
          if-no-files-found: error

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-videos-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-screenshots-${{ matrix.browser }}
          path: test-results/**/*.png
          retention-days: 7

  e2e-mobile:
    name: E2E Tests (Mobile)
    runs-on: ubuntu-24.04
    # Run mobile tests on nightly schedule or manual dispatch with 'mobile' or 'all'
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.browser == 'mobile' || github.event.inputs.browser == 'all'))
    timeout-minutes: 15  # 15 min max

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: folkcare_e2e_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm 10.9.4
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            verticals/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-e2e-

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build packages
        run: npx turbo run build

      - name: Check for unapproved bare test.skip() in e2e/tests
        run: npm run lint:e2e-skips

      - name: Install Playwright browsers (Mobile)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install --with-deps chromium webkit
          fi

      - name: Setup E2E test database
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ env.DATABASE_NAME }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ env.DATABASE_NAME }}
        run: |
          createdb -h localhost -U postgres ${{ env.DATABASE_NAME }} || echo "Database already exists"
          npm run db:migrate

      - name: Run E2E mobile tests
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ env.DATABASE_NAME }}
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3000
          CI: true
          JWT_SECRET: ${{ secrets.JWT_SECRET_E2E || 'ci-test-jwt-secret-minimum-32-characters-required-for-security-testing' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET_E2E || 'ci-test-jwt-refresh-secret-minimum-32-characters-required-for-testing' }}
        run: |
          (npm run preview --workspace=@folkcare/web -- --port 5173 --strictPort > /tmp/e2e-web.log 2>&1 &)
          ready=0
          for i in $(seq 1 60); do
            c=$(curl -s -m 2 -o /dev/null -w "%{http_code}" http://localhost:5173/login || true)
            if [ "$c" = "200" ]; then
              echo "WEB_READY_HTTP_200 after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          echo "--- web preview log (first 40 lines) ---"; head -40 /tmp/e2e-web.log || true
          if [ "$ready" != "1" ]; then
            echo "::error::Web preview server did not become ready on :5173"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npm run test:e2e -- --project=mobile-chrome --grep @mobile
          else
            npm run test:e2e:mobile
          fi

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report-mobile
          path: playwright-report/
          retention-days: 30

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: junit-results-mobile
          path: e2e-results.xml
          retention-days: 30

  e2e-report:
    name: Generate E2E Test Report
    runs-on: ubuntu-24.04
    needs: [e2e-tests]
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts/

      - name: Merge test reports
        run: |
          mkdir -p merged-report
          find artifacts -name "*.json" -exec cp {} merged-report/ \;

      - name: Upload merged report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e2e-test-report-merged
          path: merged-report/
          retention-days: 90

