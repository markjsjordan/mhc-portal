name: E2E Tests

# E2E tests are MANUAL ONLY. They do not run on pull requests, pushes, or a
# nightly schedule. Trigger them with the /mhc-e2e-testing skill (which calls
# workflow_dispatch) or `gh workflow run e2e-tests.yml`.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test (all, chromium, firefox, webkit, mobile)'
        required: false
        default: 'chromium'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
          - mobile
      update_visual_baselines:
        description: 'Regenerate Linux visual regression baselines and open a PR'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'
  DATABASE_NAME: 'folkcare_e2e_test'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  e2e-tests:
    name: E2E Tests (${{ matrix.browser || 'chromium' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # 30 min: full 13-spec suite + web preview + retries (owner-approved)

    strategy:
      fail-fast: true  # Stop on first failure
      matrix:
        # Always just run chromium - other browsers only on manual dispatch
        browser: ${{ github.event.inputs.browser == 'all' && fromJSON('["chromium", "firefox", "webkit"]') || fromJSON('["chromium"]') }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: folkcare_e2e_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            verticals/*/node_modules
            e2e/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-e2e-

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npx turbo run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Setup E2E test database
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ env.DATABASE_NAME }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ env.DATABASE_NAME }}
        run: |
          echo "Setting up E2E test database..."
          createdb -h localhost -U postgres ${{ env.DATABASE_NAME }} || echo "Database already exists"
          npm run db:migrate

      - name: Run E2E tests
        env:
          E2E_DATABASE_URL: postgresql://postgres:***@localhost:5432/${{ env.DATABASE_NAME }}
          E2E_BASE_URL: http://localhost:5173
          CI: true
          JWT_SECRET: ${{ secrets.JWT_SECRET_E2E || 'ci-test-jwt-secret-minimum-32-characters-required-for-security-testing' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET_E2E || 'ci-test-jwt-refresh-secret-minimum-32-characters-required-for-testing' }}
        run: |
          echo "Running E2E tests for ${{ matrix.browser }}..."
          # UI tests need the built web app (React SPA). The API on :3000 has no
          # static serving, so /login never rendered. Serve packages/web/dist on
          # :5173 via vite preview (which proxies /api to :3000), and point the
          # UI tests at it. API-only specs keep working against :3000.
          (npm run preview --workspace=@folkcare/web -- --port 5173 --strictPort > /tmp/e2e-web.log 2>&1 &)
          for i in $(seq 1 60); do
            c=$(curl -s -m 2 -o /dev/null -w "%{http_code}" http://localhost:5173/login || true)
            [ "$c" = "200" ] && { echo "WEB_READY_HTTP_200 after ${i}s"; break; }
            sleep 1
          done
          echo "--- web preview log (first 40 lines) ---"; head -40 /tmp/e2e-web.log || true
          npm run test:e2e -- --project=${{ matrix.browser }} --reporter=html,json,junit

      - name: Generate accessibility report
        if: always()
        run: |
          echo "Accessibility violations will be included in test report"

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: junit-results-${{ matrix.browser }}
          path: e2e-results.xml
          retention-days: 30

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-videos-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-screenshots-${{ matrix.browser }}
          path: test-results/**/*.png
          retention-days: 7

  e2e-mobile:
    name: E2E Tests (Mobile)
    runs-on: ubuntu-24.04
    # Run mobile tests on nightly schedule or manual dispatch with 'mobile' or 'all'
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.browser == 'mobile' || github.event.inputs.browser == 'all'))
    timeout-minutes: 15  # 15 min max

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: folkcare_e2e_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            verticals/*/node_modules
            e2e/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-e2e-

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npx turbo run build

      - name: Install Playwright browsers (Chromium for mobile)
        run: npx playwright install --with-deps chromium webkit

      - name: Setup E2E test database
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ env.DATABASE_NAME }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ env.DATABASE_NAME }}
        run: |
          createdb -h localhost -U postgres ${{ env.DATABASE_NAME }} || echo "Database already exists"
          npm run db:migrate

      - name: Run E2E mobile tests
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ env.DATABASE_NAME }}
          E2E_BASE_URL: http://localhost:3000
          CI: true
          JWT_SECRET: ${{ secrets.JWT_SECRET_E2E || 'ci-test-jwt-secret-minimum-32-characters-required-for-security-testing' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET_E2E || 'ci-test-jwt-refresh-secret-minimum-32-characters-required-for-testing' }}
        run: npm run test:e2e:mobile

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report-mobile
          path: playwright-report/
          retention-days: 30

  e2e-report:
    name: Generate E2E Test Report
    runs-on: ubuntu-24.04
    needs: [e2e-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts/

      - name: Merge test reports
        run: |
          mkdir -p merged-report
          find artifacts -name "*.json" -exec cp {} merged-report/ \;

      - name: Upload merged report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e2e-test-report-merged
          path: merged-report/
          retention-days: 90

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            let comment = '## E2E Test Results\n\n';

            comment += '✅ E2E tests completed across multiple browsers and devices.\n\n';
            comment += '### Test Coverage\n';
            comment += '- ✅ Critical User Journeys\n';
            comment += '- ✅ Multi-User Workflows\n';
            comment += '- ✅ Error Scenarios\n';
            comment += '- ✅ Mobile Workflows\n';
            comment += '- ✅ Performance Tests\n';
            comment += '- ✅ Accessibility (WCAG 2.1 AA)\n';
            comment += '- ✅ Data Integrity\n';
            comment += '- ✅ Security Tests\n\n';
            comment += '📊 [View Detailed Test Report](../actions/runs/${{ github.run_id }})\n\n';
            comment += '💾 Test artifacts (screenshots, videos, reports) are available in the workflow artifacts.\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  visual-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-24.04
    if: ${{ github.event.inputs.update_visual_baselines != 'true' }}
    # Pinned to @playwright/test@1.57.0 (package-lock.json) so Linux font rendering matches baselines
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - name: Install dependencies
        run: npm ci

      - name: Build showcase & run visual tests
        run: |
          npm run build --workspace=showcase
          npx vite preview --config showcase/vite.config.ts --port 5174 &
          sleep 3
          npm run test:visual

      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: playwright-visual-report/
          retention-days: 14

  update-visual-baselines:
    name: Update Visual Baselines (Linux CI)
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.update_visual_baselines == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    # Same pinned image as visual-tests so generated PNGs match CI font rendering
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - name: Install dependencies
        run: npm ci

      - name: Build showcase & update visual baselines
        run: |
          npm run build --workspace=showcase
          npx vite preview --config showcase/vite.config.ts --port 5174 &
          sleep 3
          npm run test:visual:update

      - name: Open PR with updated baselines (human review required)
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(e2e): update Linux visual regression baselines"
          branch: chore/update-visual-baselines
          title: "chore(e2e): update Linux visual regression baselines"
          body: |
            Automated Linux CI baseline update from `mcr.microsoft.com/playwright:v1.57.0-jammy`.
            Please review all changed PNGs before merging. Never auto-merge.
