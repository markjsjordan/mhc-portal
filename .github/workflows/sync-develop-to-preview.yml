name: Sync develop → preview

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Restrict default permissions to read-only
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync develop → preview
        run: |
          git fetch origin develop preview
          git push origin develop:preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord (optional)
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Discord webhook not configured - skipping notification"
            exit 0
          fi

          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Develop synced to preview",
                "description": "The preview branch is now ready for RC review at your staging environment.\n\n[View diff](https://github.com/'"${{ github.repository }}"'/compare/preview...develop)",
                "color": 3187820,
                "footer": {
                  "text": "Sync develop → preview"
                }
              }]
            }'

