name: Security & Audits

on:
  push:
    branches:
      - production
      - develop
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - production
      - develop
    paths-ignore:
      - "**.md"
  schedule:
    # Run once a week at 3:30 AM UTC on Tuesday
    - cron: "30 3 * * 2"

env:
  NODE_VERSION: "22"

# Restrict default permissions to read-only
permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac # github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: .github/codeql-config.yml
      - uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac # github/codeql-action/analyze@v4

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      # Scoped production runtime dependency security audit.
      # Separates mobile/bundler dev tooling (Metro, Expo CLI) from production runtime services
      # and ensures 0 critical vulnerabilities.
      - name: Run scoped npm audit
        run: npx tsx scripts/audit-prod-deps.ts

  dependency-update:
    name: Dependency Update Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for outdated dependencies
        run: npm outdated || true

  route-permissions-audit:
    name: Route Permissions Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run route permissions audit
        run: npx tsx scripts/audit-route-permissions.ts

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: cd packages/core && npm run test -- src/__tests__/security
